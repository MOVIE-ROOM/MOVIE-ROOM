<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile Settings</title>
<link rel="stylesheet" href="profile.css" />
</head>
<body>

<div class="container">
  <!-- Left: Profile Image Section -->
  <div class="left-section">
    <div id="profilePicture">
      <span>Click to select profile pic</span>
    </div>
  </div>

  <!-- Right: Settings Form -->
  <div class="right-section card settings-panel">
    <h2>Profile Setup</h2>
    <label for="firstName">First Name</label>
    <input type="text" id="firstName" placeholder="First name">

    <label for="middleName">Middle Name</label>
    <input type="text" id="middleName" placeholder="Middle name">

    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" placeholder="Last name">

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="user@example.com">

    <label for="age">Age</label>
    <select id="age">
      <option value="">Click to Select Age</option>
    </select>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Password">

    <label for="address">Address</label>
    <input type="text" id="address" placeholder="Address">
    
    <label for="numder">Phone no.</label>
    <input type="text" id="numder" placeholder="number">

    <div class="static-info">Payment: Auto Add</div>

    <details>
      <summary>Read More</summary>
      <p>
        This is a website or an app use for streaming shows movies and more online and offline
      this is where you create your profile to gane membership welcome to movie-room</p>
    </details>

    <div class="button-group">
      <button id="getStartedBtn" disabled>Next</button>
      <button id="nextBtn" style="display: none;">Get Started</button>
      <button id="backBtn" style="display: none;">Back</button>
    </div>
  </div>
</div>
